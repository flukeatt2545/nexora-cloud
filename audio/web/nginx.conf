limit_req_zone $binary_remote_addr zone=audio_inspect:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=audio_jobs:10m rate=3r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32k;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Real-IP;
  error_page 429 = @rate_limited;

  location @rate_limited {
    default_type application/json;
    return 429 '{"error":"ทำรายการเร็วเกินไป กรุณารอสักครู่แล้วลองใหม่"}';
  }

  location = /api/media/inspect {
    limit_req zone=audio_inspect burst=3 nodelay;
    proxy_pass http://media-api:8091;
    proxy_read_timeout 60s;
  }

  location = /api/jobs {
    limit_req zone=audio_jobs burst=2 nodelay;
    proxy_pass http://media-api:8091;
  }

  location /api/ {
    proxy_pass http://media-api:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  location = /health {
    proxy_pass http://media-api:8091/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
